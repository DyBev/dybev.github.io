name: Deploy AWS Lambda

on:
  push:
    branches: [ 'main' ]
    paths: './functions/**'

permissions:
  contents: read

concurrency:
  group: 'aws-lambda'
  cancel-in-progress: false

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_SECRET_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS }}
          aws-region: ${{ secrets.AWS_LAMBDA_REGION }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install Dependencies
        run: |
          go mod tidy

      - name: Bulid Function
        run: ./manage.sh build contact

      - name: Deploy Lambda Function
        run: aws lambda update-function-code --function-name ${{ secrets.AWS_LAMBDA_CONTACT_FUNCTION }} --zip-file fileb://build/contact.zip
