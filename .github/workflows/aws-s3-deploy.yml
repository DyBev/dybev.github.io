# Workflow for deploying static content to GitHub Pages and S3
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    pages: './static/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "aws-s3"
  cancel-in-progress: false

jobs:
  deploy-aws-s3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_SECRET_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Deploy to S3
        run: |
          cd ./static && aws s3 sync . s3://${{ secrets.AWS_BUCKET }}
